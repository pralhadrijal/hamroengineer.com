<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hamroengineer.com | Domain for Sale</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background-color: #0f172a;
      background-image: 
        linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
    }

    /* subtle circuit-like overlay */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top, rgba(14, 165, 233, 0.15), transparent 60%);
      pointer-events: none;
    }

    .container {
      position: relative;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(14, 165, 233, 0.25);
      border-radius: 16px;
      box-shadow: 
        0 0 0 1px rgba(14, 165, 233, 0.1),
        0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 540px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      padding: 32px 28px;
      text-align: center;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #22d3ee, #0ea5e9, #38bdf8);
    }

    .logo {
      font-size: 1.6rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 14px;
      font-weight: 900;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6),
                   0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .header h1 {
      color: white;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.35;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .content {
      padding: 32px 28px;
    }

    .welcome {
      background: rgba(14, 165, 233, 0.08);
      border: 1px solid rgba(14, 165, 233, 0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 28px;
      text-align: center;
    }

    .welcome p {
      margin: 6px 0;
      font-size: 1.02rem;
      color: #cbd5e1;
    }

    .ip {
      font-weight: 700;
      color: #38bdf8;
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
    }

    .location {
      color: #4ade80;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #94a3b8;
      letter-spacing: 0.3px;
    }

    input {
      padding: 14px 16px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 1rem;
      color: #f1f5f9;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.25);
      background: rgba(30, 41, 59, 0.9);
    }

    button {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
      text-transform: uppercase;
    }

    button:hover {
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .note {
      text-align: center;
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 22px;
    }

    .loading {
      color: #94a3b8;
      font-style: italic;
    }

    /* small engineering accent */
    .tech-badge {
      display: inline-block;
      background: rgba(14, 165, 233, 0.15);
      color: #38bdf8;
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-bottom: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">HAMRO ENGINEER</div>
      <h1>Do you want to buy this domain?<br>Put your offer in.</h1>
    </div>

    <div class="content">
      <div class="welcome">
        <div class="tech-badge">SYSTEM STATUS: ONLINE</div>
        <p>Welcome, Engineer.</p>
        <p>Your public IP is <span class="ip" id="ip">detecting...</span></p>
        <p class="loading" id="locationText">Thank you for visiting from <span class="location" id="location">...</span></p>
      </div>

      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="2127a689-75c0-47de-a852-a3028313f172">
        <input type="hidden" name="subject" value="New Domain Offer for hamroengineer.com">
        <input type="hidden" name="from_name" value="Domain Offer Form">
        <input type="hidden" name="redirect" value="https://hamroengineer.com/thank-you.html">

        <div>
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="name" required placeholder="Your full name">
        </div>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>

        <div>
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="+61 4xx xxx xxx">
        </div>

        <div>
          <label for="offer">Your Offer (Money)</label>
          <input type="text" id="offer" name="offer" required placeholder="e.g. $500 or 800 AUD">
        </div>

        <button type="submit">Submit Offer</button>
      </form>

      <p class="note">Your offer will be sent securely to the domain owner.</p>
    </div>
  </div>

  <script>
    async function getVisitorInfo() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();

        document.getElementById('ip').textContent = data.ip || 'Unknown';

        let locationText = '';
        if (data.city && data.country_name) {
          locationText = data.city + ', ' + data.country_name;
        } else if (data.country_name) {
          locationText = data.country_name;
        } else {
          locationText = 'your location';
        }

        document.getElementById('location').textContent = locationText;
        document.getElementById('locationText').classList.remove('loading');
      } catch (error) {
        document.getElementById('ip').textContent = 'Unavailable';
        document.getElementById('location').textContent = 'your location';
        document.getElementById('locationText').classList.remove('loading');
      }
    }

    getVisitorInfo();
  </script>
</body>
</html>
