<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy hamroengineer.com</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 520px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
      background-size: 300% 300%;
      animation: gradientShift 8s ease infinite;
      padding: 30px 20px;
      text-align: center;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header h1 {
      color: white;
      font-size: 1.8rem;
      font-weight: 800;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      line-height: 1.3;
    }

    .content {
      padding: 30px;
    }

    .welcome {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: center;
      border-left: 5px solid #667eea;
    }

    .welcome p {
      margin: 8px 0;
      font-size: 1.05rem;
    }

    .ip {
      font-weight: 700;
      color: #667eea;
      font-size: 1.15rem;
    }

    .location {
      color: #28a745;
      font-weight: 600;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #444;
    }

    input {
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    button {
      background: linear-gradient(90deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .note {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-top: 20px;
    }

    .loading {
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Do you want to buy this domain?<br>Put your offer in.</h1>
    </div>

    <div class="content">
      <div class="welcome">
        <p>Welcome!</p>
        <p>Your public IP is <span class="ip" id="ip">detecting...</span></p>
        <p class="loading" id="locationText">Thank you for visiting from <span class="location" id="location">...</span></p>
      </div>

      <form action="https://formsubmit.co/pralhadrijal99@gmail.com" method="POST">
        <!-- FormSubmit configuration -->
        <input type="hidden" name="_subject" value="New Domain Offer for hamroengineer.com">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://hamroengineer.com/thank-you.html">

        <div>
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="name" required placeholder="Your full name">
        </div>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com">
        </div>

        <div>
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="+61 4xx xxx xxx">
        </div>

        <div>
          <label for="offer">Your Offer (Money)</label>
          <input type="text" id="offer" name="offer" required placeholder="e.g. $500 or 800 AUD">
        </div>

        <button type="submit">Submit Offer</button>
      </form>

      <p class="note">Your offer will be sent directly to the domain owner.</p>
    </div>
  </div>

  <script>
    // Fetch visitor IP and location
    async function getVisitorInfo() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();

        document.getElementById('ip').textContent = data.ip || 'Unknown';

        let locationText = '';
        if (data.city && data.country_name) {
          locationText = data.city + ', ' + data.country_name;
        } else if (data.country_name) {
          locationText = data.country_name;
        } else {
          locationText = 'your location';
        }

        document.getElementById('location').textContent = locationText;
        document.getElementById('locationText').classList.remove('loading');
      } catch (error) {
        document.getElementById('ip').textContent = 'Unavailable';
        document.getElementById('location').textContent = 'your location';
        document.getElementById('locationText').classList.remove('loading');
      }
    }

    getVisitorInfo();
  </script>
</body>
</html>
