<!DOCTYPE html>
<html lang="en">
<head>

  <title>Thank You - Offer Received</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;

      background: linear-gradient(135deg, #667eea, #764ba2);

    p { font-size: 1.15rem; opacity: 0.95; }

      margin-top: 25px;
      color: white;
      text-decoration: underline;
    }

</head>

  <div class="box">
    <h1>Thank You!</h1>
